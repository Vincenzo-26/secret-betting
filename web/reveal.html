<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1f2a">
  <title>Rivelazione · Secret Betting</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/common.js"></script>
</head>
<body>
  <main class="wrap wide">
    <header class="brand"><h1 id="title">Secret Betting</h1><p id="sub">✨ La grande rivelazione ✨</p></header>
    <div id="app"></div>
  </main>

  <script>
    let lastKey = "";
    let qr;   // QR del telecomando: chiesto una volta sola (undefined = non ancora, null = non disponibile)

    async function loadQr() {
      try { qr = await api("GET", "/api/remote-qr"); } catch { qr = null; }
      return qr;
    }

    function qrBox() {
      const box = h("div", { class: "remote-qr hidden" });
      const fill = (q) => {
        if (!q) return;
        box.append(h("img", { src: q.svg, alt: "QR del telecomando" }),
          h("div", {}, h("b", {}, "📱 Telecomando"), h("div", { class: "small muted" }, "solo per l'admin")));
        box.classList.remove("hidden");
      };
      if (qr === undefined) loadQr().then(fill); else fill(qr);
      return box;
    }

    async function tick() {
      let r;
      try { r = await api("GET", "/api/reveal"); } catch { return; }
      const key = JSON.stringify(r);
      if (key === lastKey) return;   // niente di nuovo: non ri-disegnare (evita di rifare le animazioni)
      lastKey = key;
      render(r);
    }

    // Tecnica "FLIP": ogni riga parte dalla posizione vecchia e scivola in quella nuova.
    function animateBoard(board, before) {
      if (!before.size || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      for (const li of board.querySelectorAll("li[data-name]")) {
        const old = before.get(li.dataset.name);
        if (!old) continue;
        const dy = old.top - li.getBoundingClientRect().top;
        const gained = old.pts !== li.dataset.pts;
        if (dy) {
          li.style.transition = "none";
          li.style.transform = `translateY(${dy}px)`;
          li.style.position = "relative";
          li.style.zIndex = dy > 0 ? 2 : 1;          // chi sale passa sopra a chi scende
        }
        requestAnimationFrame(() => requestAnimationFrame(() => {
          li.style.transition = "transform 1.1s cubic-bezier(.22,.9,.3,1)";
          li.style.transform = "";
          if (gained) li.classList.add("scored");
        }));
        li.addEventListener("transitionend", () => { li.style.zIndex = ""; }, { once: true });
      }
    }

    // Podio: 2° a sinistra, 1° in mezzo (più alto), 3° a destra. A pari merito più nomi sullo stesso gradino.
    function podium(board) {
      const ranks = [...new Set(board.map(x => x.rank))].slice(0, 3);
      const steps = ranks.map((rank, i) => ({ place: i + 1, people: board.filter(x => x.rank === rank) }));
      const medal = ["🥇", "🥈", "🥉"];
      const order = [steps[1], steps[0], steps[2]];   // 2 - 1 - 3
      return h("div", { class: "podium" }, ...order.map(st => !st ? h("div", { class: "podium-col empty" }) :
        h("div", { class: `podium-col p${st.place}` },
          h("div", { class: "podium-who" },
            h("div", { class: "podium-medal" }, medal[st.place - 1]),
            ...st.people.map(x => h("div", { class: "podium-name" }, x.name, x.bonus ? " ⭐" : "")),
            h("div", { class: "podium-pts" }, `${st.people[0].points} punti`)),
          h("div", { class: "podium-step" }, st.place))));
    }

    function render(r) {
      $("#title").textContent = r.game.name;
      const app = $("#app");
      // Posizioni e punti della classifica PRIMA del ridisegno, per animare gli spostamenti.
      const before = new Map([...app.querySelectorAll(".board li[data-name]")].map(li =>
        [li.dataset.name, { top: li.getBoundingClientRect().top, pts: li.dataset.pts }]));
      app.innerHTML = "";

      if (r.game.phase !== "reveal") {
        app.append(h("section", { class: "card center", style: "max-width:640px;margin:0 auto" },
          h("div", { class: "gift" }, h("div", { class: "box" }, "🎁")),
          h("h2", { style: "justify-content:center" }, r.game.phase === "setup" ? "L'estrazione non è ancora stata fatta" : "Lo show sta per iniziare…"),
          r.game.phase === "playing" ? h("p", {}, `🔮 ${r.submitted} su ${r.players} hanno già consegnato i pronostici`) : null,
          r.game.phase === "playing" && r.game.deadline ? h("p", { class: "muted" },
            r.game.guesses_open ? `Pronostici aperti fino a ${fmtDate(r.game.deadline)}` : "Pronostici chiusi") : null),
          // Prima dello show: QR per collegare il telefono come telecomando (sparisce quando si inizia).
          r.game.phase === "playing" ? qrBox() : null);
        return;
      }

      $("#sub").textContent = r.complete ? "🏆 Classifica finale" : `Coppia ${r.step} di ${r.total}`;
      const stage = h("div", { class: "stage" });

      // ---------- coppie
      const left = h("section", { class: "card" });
      const last = r.pairs[r.pairs.length - 1];
      if (r.complete && r.leaderboard.length) {
        const winners = r.leaderboard.filter(x => x.rank === 1).map(x => x.name);
        left.append(h("div", { class: "spotlight" },
          h("div", { class: "winner late" }, winners.length > 1 ? `Pari merito: ${winners.join(", ")}!` : `Vince ${winners[0]}!`),
          podium(r.leaderboard)));
      } else if (last) {
        left.append(h("div", { class: "spotlight" },
          h("div", { class: "pair" }, h("span", {}, last.giver), h("span", { class: "to" }, "🎁→"), h("span", {}, last.receiver)),
          last.hits === 0
            ? h("p", { class: "muted" }, "Nessuno l'aveva indovinata! 😱")
            : h("div", { class: "guessed-by" },
                h("div", { class: "small muted" }, last.hits === 1 ? "🎯 L'ha indovinata solo" : `🎯 L'hanno indovinata in ${last.hits}`),
                h("div", { class: "chips" }, ...last.guessed_by.map(n => h("span", { class: "chip" }, n)))),
          last.receiver_knew ? h("p", {}, `⭐ ${last.receiver} aveva capito chi gli fa il regalo!`) : null,
          last.top_wrong ? h("p", { class: "muted" },
            `😅 In ${last.top_wrong.count} pensavano che ${last.giver} regalasse a ${last.top_wrong.receiver}`) : null));
      } else {
        left.append(h("div", { class: "spotlight" }, h("div", { class: "gift" }, h("div", { class: "box" }, "🎁")),
          h("h2", { style: "justify-content:center" }, "Pronti? Si parte!")));
      }
      if (r.pairs.length) {
        const list = h("ul", { class: "list" });
        r.pairs.slice().reverse().forEach(p => list.append(h("li", {},
          h("b", {}, p.giver), " → ", h("b", {}, p.receiver), h("span", { class: "spacer" }),
          h("span", { class: "pill grey" }, `${p.hits} 🎯`))));
        left.append(h("h3", {}, "Coppie svelate"), list);
      }

      // ---------- classifica
      const right = h("section", { class: "card" }, h("h2", {}, "🏅 Classifica"));
      const board = h("ul", { class: "list board" });
      for (const x of r.leaderboard) {
        board.append(h("li", { class: x.rank === 1 && x.points > 0 ? "first" : "", "data-name": x.name, "data-pts": x.points },
          h("span", { class: "rank" }, x.points === 0 ? x.rank + "°" : x.rank === 1 ? "🥇" : x.rank === 2 ? "🥈" : x.rank === 3 ? "🥉" : x.rank + "°"),
          h("span", {}, x.name, x.bonus ? " ⭐" : ""),
          h("span", { class: "spacer" }),
          h("span", { class: "pts" }, x.points)));
      }
      right.append(board, h("p", { class: "small muted" }, "⭐ = ha indovinato chi gli fa il regalo"));

      stage.append(left, right);
      app.append(stage);
      animateBoard(board, before);

      // ---------- tutti gli indizi distribuiti (solo a rivelazione completata)
      if (r.complete && r.hints && r.hints.length) {
        // 4 indizi a testa = tanti: su schermo largo vanno su due colonne.
        const list = h("ul", { class: "list", style: "display:grid;grid-template-columns:repeat(auto-fill,minmax(480px,1fr));column-gap:24px" });
        for (const x of r.hints) {
          const chip = h("span", { class: "chip" }, `${x.trait}: ${x.value}`);
          const text = x.kind === "santa_of"
            ? h("span", {}, "Chi fa il regalo a ", h("b", {}, x.subject), " ha ", chip)
            : h("span", {}, h("b", {}, x.subject), " fa il regalo a qualcuno con ", chip);
          list.append(h("li", { style: "flex-wrap:wrap" },
            h("span", { class: "pill grey" }, `${x.player} #${x.slot}`), text, h("span", { class: "spacer" }),
            x.is_true ? h("span", { class: "pill" }, "✅ Vero") : h("span", { class: "pill red" }, "❌ Falso")));
        }
        app.append(h("section", { class: "card", style: "margin-top:20px" }, h("h2", {}, "🕵️ Gli indizi distribuiti"), list));
      }
    }

    // Tastiera (se questo browser è loggato come admin): spazio / → avanti, ← indietro.
    // Così si può guidare lo show anche dal PC collegato alla TV, senza telecomando.
    let keyBusy = false;
    document.addEventListener("keydown", async (e) => {
      const action = { " ": "next", "ArrowRight": "next", "PageDown": "next", "ArrowLeft": "prev", "PageUp": "prev" }[e.key];
      if (!action || keyBusy) return;
      e.preventDefault();
      keyBusy = true;
      try {
        await api("POST", "/api/admin/reveal", { action });
        await tick();
      } catch (ex) {
        toast(ex.status === 401 ? "Per usare la tastiera accedi prima come admin su questo browser (/admin)" : ex.message);
      }
      keyBusy = false;
    });

    tick();
    setInterval(tick, 2000);
  </script>
</body>
</html>
