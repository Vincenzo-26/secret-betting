<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1f2a">
  <title>Schede · Secret Betting</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/common.js"></script>
</head>
<body>
  <main class="wrap">
    <header class="brand"><h1>Le Schede</h1><p>📋 Chi è chi, per decifrare gli indizi</p></header>
    <div class="topbar">
      <a class="btn ghost small" href="/me">← Il mio profilo</a>
    </div>
    <section class="card" id="card"><p class="center muted">Caricamento…</p></section>
  </main>

  <script>
    const card = $("#card");

    function render(r) {
      card.innerHTML = "";
      if (!r.traits.length) {
        card.append(h("h2", {}, "📋 Nessuna scheda"), h("p", {}, "L'admin non ha ancora definito le caratteristiche."));
        return;
      }
      card.append(h("h2", {}, "📋 Schede dei partecipanti"),
        h("p", { class: "small muted" }, "Scorri la tabella di lato se non ci sta tutta. La tua riga è evidenziata."));

      // Filtro rapido: mostra solo chi ha un certo valore (comodo per gli indizi).
      const filter = h("select", { "aria-label": "Filtra per caratteristica" },
        h("option", { value: "" }, "🔎 Mostra tutti"),
        r.traits.map(t => h("optgroup", { label: t.name },
          t.options.map(o => h("option", { value: `${t.id}|${o}` }, `${t.name}: ${o}`)))));
      card.append(filter);

      const table = h("table", { class: "schede-table" });
      table.append(h("thead", {}, h("tr", {}, h("th", {}, "Nome"),
        r.traits.map(t => h("th", { title: t.derived ? "Calcolata dalla data di nascita" : null }, (t.derived ? "📅 " : "") + t.name)))));
      const tb = h("tbody", {});
      const rows = r.people.map(p => {
        const tr = h("tr", { class: p.id === r.me ? "me" : "" },
          h("td", {}, p.id === r.me ? `${p.name} (tu)` : p.name),
          r.traits.map(t => h("td", {}, p.values[t.id] || "—")));
        tb.append(tr);
        return { p, tr };
      });
      table.append(tb);
      card.append(h("div", { class: "table-scroll", style: "margin-top:12px" }, table));

      filter.addEventListener("change", () => {
        const [tid, val] = filter.value.split("|");
        for (const { p, tr } of rows) tr.classList.toggle("hidden", !!filter.value && p.values[tid] !== val);
      });
    }

    api("GET", "/api/schede").then(render).catch(ex => {
      card.innerHTML = "";
      card.append(h("h2", {}, "🔑 Accesso richiesto"),
        h("p", {}, ex.status === 401 ? "Apri il link personale che ti ha mandato l'admin per entrare." : ex.message));
    });
  </script>
</body>
</html>
